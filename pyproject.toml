requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.1.0",
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "kokoro-onnx>=0.6.1",
    "lxml>=6.1.2",
    "numpy>=2.5.2",
    "openai>=3.5.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv.workspace]
members = [
    "engines/chatterbox",
]
